<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <div class="header-brand">
        <div class="header-icon-badge">
          <svg class="header-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </div>
        <div class="header-text">
          <h1 class="app-title">Book Tracker</h1>
          <p class="app-subtitle">Keep track of what you read.</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="app-layout">
      <!-- Left Column: Add a Book Form Card (Sticky on 900px+) -->
      <aside class="layout-sidebar">
        <section class="card form-card">
          <h2 class="card-title">Add a Book</h2>
          <form id="book-form" novalidate>
            <div class="form-group">
              <label for="book-title">Title</label>
              <input type="text" id="book-title" name="title" autocomplete="off" placeholder="e.g. Atomic Habits">
              <div class="error-message" id="title-error"></div>
            </div>

            <div class="form-group">
              <label for="book-author">Author</label>
              <input type="text" id="book-author" name="author" autocomplete="off" placeholder="e.g. James Clear">
              <div class="error-message" id="author-error"></div>
            </div>

            <div class="form-group">
              <label for="book-status">Status</label>
              <select id="book-status" name="status">
                <option value="To read">To read</option>
                <option value="Reading">Reading</option>
                <option value="Finished">Finished</option>
              </select>
            </div>

            <button type="submit" id="submit-btn">Add</button>
          </form>
        </section>
      </aside>

      <!-- Right Column: Search & Books List -->
      <section id="books-section" class="books-section layout-content">
        <div class="section-header">
          <h2>Books</h2>
          <div id="books-summary" class="books-summary"></div>
        </div>
        <div class="form-group search-group">
          <label for="search-input">Search Books</label>
          <input type="text" id="search-input" placeholder="Search by title or author..." autocomplete="off">
        </div>
        <div id="empty-message" class="empty-message"></div>
        <ul id="book-list"></ul>
      </section>
    </div>
  </main>

  <!-- Delete Confirmation Modal Popup -->
  <div id="delete-modal" class="modal-overlay" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-icon-badge">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </div>
      <h3 id="modal-title" class="modal-title">Delete this book?</h3>
      <p id="modal-desc" class="modal-desc">This book will be removed from your collection.</p>
      <div class="modal-actions">
        <button type="button" id="modal-cancel-btn" class="btn-secondary">Cancel</button>
        <button type="button" id="modal-confirm-btn" class="btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
